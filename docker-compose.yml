services:
  app:
    build:
      context: .
      target: runner
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: always
    networks:
      - ai-network

  # добавить ui контейнер для redis, когда начну работать с кешированием
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - '8081:8081'
    networks:
      - ai-network
    depends_on:
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    ports:
      - '6333:6333'
      - '6334:6334' # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.50'
    healthcheck:
      test:
        ['CMD', 'curl', '-f', '-H', 'api-key: ${QDRANT_API_KEY}', 'http://localhost:6333/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - ai-network

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4096M
        # Раскомментируйте, если есть доступный GPU nvidia
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
    restart: always
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  qdrant_storage:
  ollama_storage:
  redis_data:
