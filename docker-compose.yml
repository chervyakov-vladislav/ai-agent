services:
  app:
    build:
      context: .
      target: runner
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - qdrant
      - ollama
      - redis
    networks:
      - ai-network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ai-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.50'
    networks:
      - ai-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 2048M
        # Раскомментируйте, если есть доступный GPU nvidia
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  qdrant_storage:
  ollama_storage:
  redis_data:
